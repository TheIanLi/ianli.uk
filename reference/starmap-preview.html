<title>ianli.uk 星图</title>
<style>
/* 布局：全屏 3D 星图做画布，四角放仪表式 HUD；点开节点后右侧滑出玻璃面板（手机变底部抽屉） */
:root{
  --bg:#05060d;
  --bg-2:#0c0f22;
  --ink:#ebe9f6;
  --ink-2:#a3a2bd;
  --ink-3:#6d6c88;
  --hair:rgba(196,200,255,.12);
  --glass:rgba(12,14,28,.74);
  --c-core:#f3efff;
  --c-net:#5cb6ff;
  --c-ai:#ffb054;
  --c-proj:#ff6b8f;
  --c-base:#a68fff;
  --ok:#5fd39a;
  --wip:#ffcf6b;
  --old:#8a8aa3;
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 70% at 50% 46%,var(--bg-2),var(--bg) 72%);
  color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage.dragging{cursor:grabbing}
#stage.pointing{cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:3;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);pointer-events:none}
.hud > *{pointer-events:auto}
.reveal{animation:reveal .9s ease 2.1s both}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand{display:grid;gap:6px}
.brand .domain{color:var(--ink-3);text-transform:uppercase;letter-spacing:.32em;font-size:10px}
.brand h1{margin:0;font-family:var(--font-mono);font-weight:500;font-size:clamp(20px,3.2vw,30px);letter-spacing:.42em;color:var(--ink);line-height:1}
.brand h1 span{display:inline-block;animation:glyph .5s steps(1) both}
@keyframes glyph{0%{opacity:0}40%{opacity:1;color:var(--c-ai)}100%{opacity:1}}
.brand p{margin:2px 0 0;font-family:var(--font-ui);font-size:13px;letter-spacing:.08em;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--hair);
  border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  transition:background .2s,border-color .2s;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(220,224,255,.28)}
.btn:focus-visible,.chip:focus-visible,.leg:focus-visible,.res button:focus-visible,.close:focus-visible{outline:2px solid var(--c-ai);outline-offset:2px}
.kbd{font-size:10px;color:var(--ink-3);border:1px solid var(--hair);border-radius:4px;padding:1px 5px}

.legend{left:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:4px}
.legend .cap{color:var(--ink-3);text-transform:uppercase;letter-spacing:.24em;font-size:10px;margin-bottom:4px}
.leg{
  font:inherit;color:var(--ink-2);background:none;border:0;padding:4px 6px 4px 0;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left;transition:color .2s,opacity .2s;
}
.leg i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.leg b{font-weight:400;font-family:var(--font-ui);font-size:12.5px;letter-spacing:.04em}
.leg em{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.leg:hover,.leg[aria-pressed="true"]{color:var(--ink)}
.legend.filtering .leg[aria-pressed="false"]{opacity:.38}

.readout{right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:right;display:grid;gap:5px;font-variant-numeric:tabular-nums}
.readout .coords{color:var(--ink-2)}
.readout .hint{color:var(--ink-3)}
.readout .replay{justify-self:end;margin-top:4px;padding:5px 10px;font-size:10.5px}

/* ---------- 节点标签 ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lab{
  position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--ink-2);
  will-change:transform,opacity;opacity:0;text-shadow:0 0 8px var(--bg),0 0 2px var(--bg);
}
.lab small{font-family:var(--font-mono);font-size:9.5px;color:var(--c);letter-spacing:.12em;margin-right:6px;opacity:.85}
.lab.hot{color:var(--ink);font-size:13.5px}

/* ---------- 详情面板 ---------- */
#panel{
  position:fixed;z-index:4;top:calc(84px + env(safe-area-inset-top,0px));right:20px;width:min(360px,calc(100vw - 40px));
  max-height:calc(100% - 180px);overflow:auto;
  background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--hair);border-radius:16px;padding:20px 20px 18px;
  transform:translateX(calc(100% + 40px));opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;
  display:grid;gap:14px;
}
#panel.open{transform:none;opacity:1}
.p-head{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.p-head i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.p-head .nid{color:var(--ink-3)}
.close{margin-left:auto;font:inherit;background:none;border:1px solid var(--hair);color:var(--ink-2);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.close:hover{color:var(--ink);border-color:rgba(220,224,255,.3)}
#panel h2{margin:0;font-size:22px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;width:max-content}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok)}.s-wip{color:var(--wip)}.s-old{color:var(--old)}
#panel p.sum{margin:0;font-size:14px;line-height:1.75;color:var(--ink-2)}
#panel pre{
  margin:0;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--hair);
  font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--ink);overflow-x:auto;white-space:pre;
}
#panel pre::before{content:"$ ";color:var(--ink-3)}
#panel pre.note::before{content:""}
#panel pre.note{color:var(--ink-2)}
.p-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.links{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:inherit;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:999px;
  padding:5px 11px 5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s,border-color .2s;
}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip:hover{background:rgba(255,255,255,.08);border-color:rgba(220,224,255,.3)}
.p-foot{font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--hair);padding-top:12px;line-height:1.6}

/* ---------- 搜索 / 终端 ---------- */
#palette{position:fixed;inset:0;z-index:6;background:rgba(3,4,10,.55);display:grid;place-items:start center;padding:calc(14vh + env(safe-area-inset-top,0px)) 16px 16px}
.term{
  width:min(560px,100%);background:rgba(10,12,24,.92);border:1px solid var(--hair);border-radius:12px;overflow:hidden;
  font-family:var(--font-mono);box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.term-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--hair);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
.term-bar i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);opacity:.5}
.term-bar span{margin-left:8px}
.prompt{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-size:13.5px}
.prompt label{color:var(--ok);white-space:nowrap}
.prompt label b{color:var(--c-net);font-weight:400}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;caret-color:var(--c-ai)}
.res{list-style:none;margin:0;padding:4px 6px 8px;max-height:min(46vh,340px);overflow:auto}
.res button{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:0;background:none;color:var(--ink-2);
  font-family:var(--font-ui);font-size:13.5px;cursor:pointer;text-align:left;
}
.res button i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.res button em{margin-left:auto;font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.res li.on button{background:rgba(255,255,255,.07);color:var(--ink)}
.res .empty{padding:10px 12px;color:var(--ink-3);font-size:12.5px}

/* ---------- 无 WebGL 时的退路 ---------- */
#fallback{position:fixed;inset:0;overflow:auto;padding-block:96px 40px;padding-inline:20px;z-index:1}
#fallback .wrap{max-width:720px;margin:0 auto;display:grid;gap:28px}
#fallback h3{margin:0 0 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;display:flex;gap:8px;align-items:center}
#fallback h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#fallback ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
#fallback li b{display:block;font-size:15px;margin-bottom:2px}
#fallback li span{font-size:13.5px;color:var(--ink-2);line-height:1.7}

@media (max-width:720px){
  .top{left:16px;right:16px}
  .brand h1{letter-spacing:.3em}
  .actions .btn .lbl{display:none}
  .legend{left:16px;right:16px;display:flex;flex-wrap:wrap;gap:0 14px}
  .legend .cap{display:none}
  .leg b{font-size:12px}
  .readout{right:16px;bottom:auto;top:calc(110px + env(safe-area-inset-top,0px))}
  .readout .coords,.readout .hint{display:none}
  .lab{font-size:11px}
  .lab small{display:none}
  .lab.hot{font-size:12.5px}
  #panel{
    top:auto;bottom:0;right:0;left:0;width:auto;max-height:58%;border-radius:18px 18px 0 0;
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);
  }
  #panel.open{transform:none}
  body.sheet .legend,body.sheet .readout{opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){
  .reveal,.brand h1 span{animation:none}
  #panel{transition:none}
}
</style>

<canvas id="stage" tabindex="0" aria-label="3D 星图：拖动旋转，点击节点查看详情"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="hud top">
  <div class="brand">
    <div class="domain reveal">ianli.uk · 星图</div>
    <h1 id="name" aria-label="IAN LI"></h1>
    <p class="reveal">折腾记录与个人笔记</p>
  </div>
  <div class="actions reveal">
    <button class="btn" id="openSearch" type="button"><span class="lbl">搜索节点</span><span class="kbd">/</span></button>
    <a class="btn" href="https://github.com/TheIanLi" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</header>

<nav class="hud legend reveal" id="legend" aria-label="分类"></nav>

<div class="hud readout reveal">
  <div class="coords" id="coords">θ 0.0° · φ 0.0° · r 0</div>

  <button class="btn replay" id="replay" type="button">重放开场</button>
</div>

<aside id="panel" aria-live="polite" aria-hidden="true">
  <div class="p-head"><i id="pDot"></i><span id="pCat"></span><span class="nid" id="pId"></span>
    <button class="close" id="pClose" type="button" aria-label="关闭">✕</button></div>

  <div class="p-foot">预览版示例文案。正式版里每个节点是一个 Markdown 文件，点进去是完整笔记。</div>
</aside>

<div id="palette" hidden>
  <div class="term" role="dialog" aria-label="搜索节点">
    <div class="term-bar"><i></i><i></i><i></i><span>ian@ianli — goto</span></div>

    <ul class="res" id="res" role="listbox"></ul>

</div>

<section id="fallback" hidden><div class="wrap" id="fbWrap"></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ================= 数据（正式版从 Markdown 自动生成） ================= */
const CAT = {
  core:{name:"本站",          color:"#f3efff"},
  net: {name:"服务器与网络",  color:"#5cb6ff"},
  ai:  {name:"AI 与 Agent",   color:"#ffb054"},
  proj:{name:"项目",          color:"#ff6b8f"},
  base:{name:"基础",          color:"#a68fff"}
};
const STATUS = {ok:["在用","s-ok"], wip:["迭代中","s-wip"], old:["折腾过","s-old"]};
const NODES = [
  {id:"site",  name:"ianli.uk",          cat:"core", st:"wip", alias:"本站 网站 home",
   sum:"你正在看的这个网站。静态生成，部署在 Cloudflare，图里的每个点都是一篇笔记。", cmd:"git push   # Cloudflare 自动构建上线"},
  {id:"vps",   name:"VPS",               cat:"net",  st:"ok",  alias:"服务器 server",
   sum:"几台海外小鸡。挑线路、测延迟、装系统、做基础加固，都从这里开始。", cmd:"ssh vps 'uptime && df -h /'"},
  {id:"cfw",   name:"Cloudflare Workers",cat:"net",  st:"ok",  alias:"cloudflare cf worker",
   sum:"边缘函数加静态资源托管。本站和服务器探针都跑在上面。", cmd:"npx wrangler dev"},
  {id:"dns",   name:"DNS 与子域名",       cat:"net",  st:"ok",  alias:"dns 域名 subdomain",
   sum:"一个域名，按子域名拆给不同服务：主站、探针、其他实验。", cmd:"dig +short ianli.uk"},
  {id:"git",   name:"Git / GitHub",      cat:"base", st:"ok",  alias:"git github",
   sum:"所有东西的版本管理。以后写笔记也是 commit 一下就上线。", cmd:"git log --oneline -5"},
  {id:"probe", name:"服务器探针",         cat:"net",  st:"ok",  alias:"probe monitor 监控",
   sum:"每台机器的在线状态和延迟汇总到一个页面，晚高峰一眼看出哪台在掉。", cmd:"# 每台机器一个轻量上报，Worker 汇总展示", note:true},
  {id:"singbox",name:"sing-box 分流",     cat:"net",  st:"ok",  alias:"sing-box singbox 路由 分流",
   sum:"按规则集把流量分到不同出口，配置写成文件，改一次全设备同步。", cmd:"sing-box check -c config.json"},
  {id:"linux", name:"Linux",             cat:"base", st:"ok",  alias:"linux debian ubuntu systemd",
   sum:"一切的地基。systemd、日志、权限、网络，踩过的坑都记在这一类里。", cmd:"journalctl -u sing-box -f"},
  {id:"duya",  name:"渡鸦 Agent",         cat:"ai",   st:"wip", alias:"渡鸦 duya hermes agent",
   sum:"基于 Hermes 搭的个人 agent，接了一堆工具，长期迭代中。", cmd:"# 人设、工具接入、运行环境的记录", note:true},
  {id:"ollama",name:"Ollama 本地模型",     cat:"ai",   st:"old", alias:"ollama 本地 llm",
   sum:"在本地跑开源模型，测显存、速度和效果的边界。", cmd:"ollama run qwen2.5:7b"},
  {id:"mcp",   name:"MCP 协议",           cat:"ai",   st:"ok",  alias:"mcp model context protocol",
   sum:"让 AI 工具调用外部能力的协议。自己写过一个 MCP Server。", cmd:"# mcpServers → command / args / env", note:true},
  {id:"cc",    name:"Claude Code",       cat:"ai",   st:"ok",  alias:"claude code vibe coding",
   sum:"主力 vibe coding 工具。从输出倒推需求，让它把东西做出来。", cmd:"claude"},
  {id:"rag",   name:"RAG 检索",           cat:"ai",   st:"old", alias:"rag 向量 embedding chromadb bge",
   sum:"BGE 做向量化，ChromaDB 存，检索后交给大模型生成。", cmd:"# embed → store → retrieve → generate", note:true},
  {id:"py",    name:"Python",            cat:"base", st:"ok",  alias:"python py",
   sum:"写工具和脚本的主语言，项目大多用它。", cmd:"python -m venv .venv && source .venv/bin/activate"},
  {id:"wsl",   name:"WSL",               cat:"base", st:"ok",  alias:"wsl windows",
   sum:"在 Windows 上要一个真 Linux 环境，本地开发都在这里。", cmd:"wsl --install"},
  {id:"ds",    name:"DeepSeek API",      cat:"ai",   st:"old", alias:"deepseek api llm",
   sum:"便宜好用的国产模型 API，几个项目的生成环节都接的它。", cmd:"POST /chat/completions", note:true},
  {id:"mb",    name:"Memory Bridge",     cat:"proj", st:"old", alias:"memory bridge 记忆 项目",
   sum:"一个基于 RAG 的记忆应用：把零散记录变成能问答的知识库。", cmd:"# BGE + ChromaDB + DeepSeek", note:true},
  {id:"snap",  name:"Agent 配置快照",      cat:"proj", st:"wip", alias:"snapshot agent 配置 mcp 项目",
   sum:"CLI 加 MCP Server：给 agent 配置做快照、对比、回滚和监听。", cmd:"snapshot · diff · rollback · watch", note:true}
];
const LINKS = [
  ["site","cfw"],["site","dns"],["site","git"],["site","cc"],
  ["cfw","probe"],["cfw","dns"],["probe","vps"],["vps","linux"],["vps","singbox"],["vps","dns"],["singbox","linux"],
  ["duya","mcp"],["duya","linux"],["duya","py"],
  ["ollama","wsl"],["ollama","rag"],["wsl","linux"],["py","linux"],
  ["rag","py"],["mb","rag"],["mb","py"],["mb","ds"],["mb","git"],
  ["snap","mcp"],["snap","py"],["snap","cc"],["snap","git"],["cc","mcp"]
];

const IDX = {}; NODES.forEach((n,i)=>{IDX[n.id]=i; n.i=i; n.code="N-"+String(i).padStart(2,"0"); n.nb=new Set();});
const EDGES = LINKS.map(([a,b])=>{const s=IDX[a],t=IDX[b]; NODES[s].nb.add(t); NODES[t].nb.add(s); return {s,t,len:(a==="site"||b==="site")?15:12};});

const $ = s=>document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTouch = matchMedia("(pointer: coarse)").matches;

/* 名字逐字出现 */
(function(){const h=$("#name"); "IAN LI".split("").forEach((c,k)=>{const s=document.createElement("span"); s.textContent=c===" "?" ":c; s.style.animationDelay=reduce?"0s":(1.5+k*.09)+"s"; h.appendChild(s);});})();
$("#hint").textContent = isTouch ? "拖动旋转 · 双指缩放 · 点按节点" : "拖动旋转 · 滚轮缩放 · 点击节点 · / 搜索";

/* 图例 */
const legend=$("#legend"); let focusCat=null;
(function(){
  const cap=document.createElement("div"); cap.className="cap"; cap.textContent=NODES.length+" 节点 · "+EDGES.length+" 连接"; legend.appendChild(cap);
  Object.keys(CAT).forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.className="leg"; b.dataset.cat=k; b.setAttribute("aria-pressed","false");
    b.style.setProperty("--c",CAT[k].color);
    const cnt=NODES.filter(n=>n.cat===k).length;
    b.innerHTML="<i></i><b></b><em></em>"; b.querySelector("b").textContent=CAT[k].name; b.querySelector("em").textContent=String(cnt).padStart(2,"0");
    b.addEventListener("click",()=>{focusCat = focusCat===k?null:k; syncLegend();});
    legend.appendChild(b);
  });
})();
function syncLegend(){
  legend.classList.toggle("filtering",!!focusCat);
  legend.querySelectorAll(".leg").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cat===focusCat)));
}

/* ================= 没有 WebGL 的退路 ================= */
function showFallback(){
  $("#stage").hidden=true; $("#labels").hidden=true; $("#replay").hidden=true; $(".coords").hidden=true; $("#hint").hidden=true; legend.hidden=true;

/* ================= 力导向模拟 ================= */
const P=NODES.map(()=>new THREE.Vector3()), V=NODES.map(()=>new THREE.Vector3()), R=NODES.map(()=>new THREE.Vector3());
const REP=25, SPR=.04, CEN=.006, DAMP=.88;
let alpha=1;
const tmp=new THREE.Vector3();
function seed(explode){
  NODES.forEach((n,i)=>{
    const d=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();
    if(n.cat==="core"){P[i].set(0,0,0);V[i].set(0,0,0);return;}
    P[i].copy(d).multiplyScalar(explode?.3:12+Math.random()*10);
    V[i].copy(d).multiplyScalar(explode?2.2+Math.random()*1.6:0);
  });
  alpha=1;
}
function simStep(hot){
  const n=P.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    tmp.subVectors(P[i],P[j]); let d2=tmp.lengthSq();
    if(d2<1e-4) tmp.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
    d2=Math.max(d2,9); const f=REP*alpha/(d2*Math.sqrt(d2));
    tmp.multiplyScalar(f); V[i].add(tmp); V[j].sub(tmp);
  }
  for(const e of EDGES){
    tmp.subVectors(P[e.t],P[e.s]); const d=tmp.length()||.01; const k=(d-e.len)/d*SPR*alpha;
    tmp.multiplyScalar(k); V[e.s].add(tmp); V[e.t].sub(tmp);
  }
  if(hot>=0){ NODES[hot].nb.forEach(j=>{ tmp.subVectors(P[hot],P[j]); const d=tmp.length(); if(d>9) V[j].addScaledVector(tmp,.0035); }); }
  for(let i=0;i<n;i++){
    if(NODES[i].cat==="core"){P[i].set(0,0,0);V[i].set(0,0,0);continue;}
    V[i].addScaledVector(P[i],-CEN*alpha); V[i].multiplyScalar(DAMP); P[i].add(V[i]);
  }
  alpha=Math.max(hot>=0?.12:.03,alpha*.99);
}

const v3=new THREE.Vector3();
function screenOf(i,out){
  v3.copy(R[i]).project(camera);
  out.x=(v3.x+1)/2*W; out.y=(1-v3.y)/2*H; out.z=v3.z;
  const dist=camera.position.distanceTo(R[i]);
  out.ppu=(H/2)/(Math.tan(camera.fov*Math.PI/360)*dist); out.dist=dist;
  return out;
}
const SC=NODES.map(()=>({x:0,y:0,z:0,ppu:1,dist:1}));
function pick(x,y){
  let best=-1, bd=1e9;
  NODES.forEach((n,i)=>{
    const s=SC[i]; if(s.z>1||S[i]<.5) return;
    const rad=Math.max(isTouch?22:16,(n.cat==="core"?5.5:3.2)*s.ppu);
    if(Math.hypot(s.x-x,s.y-y)<rad && s.dist<bd){bd=s.dist;best=i;}
  });
  return best;
}

/* 指针：拖动旋转 / 双指缩放 / 点击 */
const ptrs=new Map(); let moved=false, pinch=null, downAt=null;
const pdist=()=>{const a=[...ptrs.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false; downAt={x:e.clientX,y:e.clientY};}
  if(ptrs.size===2){pinch={d:pdist(),r:camG.r}; moved=true;}
  lastInteract=performance.now();
});
canvas.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId)){
    const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(ptrs.size===1){
      if(!moved && Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>5){moved=true; canvas.classList.add("dragging");}
      if(moved){camG.th-=dx*.0055; camG.ph=clamp(camG.ph-dy*.0055,.25,Math.PI-.25);}
    }else if(ptrs.size===2 && pinch){camG.r=clamp(pinch.r*pinch.d/pdist(),22,240);}
    lastInteract=performance.now();
  }else if(e.pointerType==="mouse"){
    const h=pick(e.clientX,e.clientY);
    if(h!==hover){hover=h; canvas.classList.toggle("pointing",h>=0);}
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  const wasSingle=ptrs.size===1; ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  canvas.classList.remove("dragging");
  if(wasSingle && !moved && e.type==="pointerup"){
    const i=pick(e.clientX,e.clientY);
    if(i>=0) select(i); else if(selected>=0) deselect();
  }
}

/* ================= 主循环 ================= */
const labelsBox=$("#labels");
const LAB=NODES.map(n=>{
  const d=document.createElement("div"); d.className="lab"; d.style.setProperty("--c",CAT[n.cat].color);
  d.innerHTML="<small></small>"; d.querySelector("small").textContent=n.code; d.append(n.name); labelsBox.appendChild(d); return d;
});
const ease=x=>1-Math.pow(1-clamp(x,0,1),3);
let frameNo=0;
const coords=$("#coords");

function frame(now){
  requestAnimationFrame(frame);
  const t=(now-t0)/1000, tt=now/1000;

  /* 模拟 */
  if(reduce||t>BANG) simStep(activeNode());

  /* 节点 */
  NODES.forEach((n,i)=>{
    R[i].copy(P[i]); if(!reduce) R[i].y+=Math.sin(tt*.7+PH[i])*.35;
    const appear=reduce?1:(n.cat==="core"?ease((t-.1)/.4):ease((t-BANG-.05)/.6));
    S[i]=appear;
    const o=OBJ[i];
    const want=(i===activeNode()?1.28:1)*appear;
    o.g.scale.setScalar(o.g.scale.x+(want-o.g.scale.x)*.18 || .0001);
    o.g.position.copy(R[i]);
    o.spin(reduce?0:tt,PH[i]);
    D[i]+=(dimTarget(i)-D[i])*.12;
    o.mats.forEach(({mat,base})=>{mat.opacity=base*D[i];});
  });
  coreLight.intensity=2.2*S[0];

  /* 连线 */
  const a=activeNode();
  EDGES.forEach((e,k)=>{
    const ps=R[e.s], pt=R[e.t], o=k*6;
    lPos[o]=ps.x;lPos[o+1]=ps.y;lPos[o+2]=ps.z;lPos[o+3]=pt.x;lPos[o+4]=pt.y;lPos[o+5]=pt.z;
    let it=.34*Math.min(D[e.s],D[e.t]);
    if(a>=0&&(e.s===a||e.t===a)) it=1;
    else if(focusCat&&NODES[e.s].cat===focusCat&&NODES[e.t].cat===focusCat&&a<0) it=.6;
    const cs=NCOL[e.s], ct=NCOL[e.t];
    lCol[o]=cs.r*it;lCol[o+1]=cs.g*it;lCol[o+2]=cs.b*it;lCol[o+3]=ct.r*it;lCol[o+4]=ct.g*it;lCol[o+5]=ct.b*it;
  });
  lGeo.attributes.position.needsUpdate=true; lGeo.attributes.color.needsUpdate=true;
  lMat.opacity=reduce?1:ease((t-1.25)/1.4);

  /* 流动粒子：从当前节点流向邻居 */
  let fc=0;
  if(a>=0&&!reduce){
    EDGES.forEach(e=>{
      if(e.s!==a&&e.t!==a) return;
      const from=R[a], to=R[e.s===a?e.t:e.s];
      for(let k=0;k<FLOW_PER;k++){
        const u=(tt*.45+k/FLOW_PER)%1;
        fPos[fc*3]=from.x+(to.x-from.x)*u; fPos[fc*3+1]=from.y+(to.y-from.y)*u; fPos[fc*3+2]=from.z+(to.z-from.z)*u; fc++;
      }
    });
  }
  fGeo.setDrawRange(0,fc); fGeo.attributes.position.needsUpdate=true;

  /* 开场闪光 */
  if(!reduce&&t<2.2){
    const f=clamp((t-.35)/.9,0,1);
    flash.scale.setScalar(4+ease(f)*90); flash.material.opacity=f<=0?0:Math.pow(1-f,1.6)*.95;
    const rf=clamp((t-.5)/1.5,0,1);
    ring.scale.setScalar(1+ease(rf)*110); ring.material.opacity=rf<=0?0:(1-rf)*.75; ring.lookAt(camera.position);
  }else{flash.material.opacity=0; ring.material.opacity=0; if(!introDone&&t>3.2) introDone=true;}

  /* 相机 */
  const idle=now-lastInteract;
  if(!reduce&&selected<0&&!ptrs.size&&idle>2500) camG.th+=.0011;
  if(selected>=0) camG.tx.copy(R[selected]); else camG.tx.multiplyScalar(.9);
  const k=.075;
  camS.th+=(camG.th-camS.th)*k; camS.ph+=(camG.ph-camS.ph)*k;
  camS.r+=(camG.r-camS.r)*(t<3?.035:k); camS.tx.lerp(camG.tx,k);
  const sp=Math.sin(camS.ph);
  camera.position.set(camS.tx.x+camS.r*sp*Math.sin(camS.th), camS.tx.y+camS.r*Math.cos(camS.ph), camS.tx.z+camS.r*sp*Math.cos(camS.th));
  camera.lookAt(camS.tx);
  off.x+=(off.gx-off.x)*k; off.y+=(off.gy-off.y)*k;
  if(Math.abs(off.x)>.5||Math.abs(off.y)>.5) camera.setViewOffset(W,H,off.x,off.y,W,H); else if(camera.view&&camera.view.enabled) camera.clearViewOffset();
  scene.getObjectByName("stars").rotation.y=tt*.004;

  /* 标签 */
  const labIn=reduce?1:ease((t-2.1)/1);
  NODES.forEach((n,i)=>{
    const s=screenOf(i,SC[i]), el=LAB[i];
    if(s.z>1||S[i]<.05){el.style.opacity="0";return;}
    const rad=(n.cat==="core"?5.5:3)*s.ppu;
    const depth=clamp(1.25-(s.dist-camS.r*.6)/(camS.r*1.1),.3,1);
    const hot=i===activeNode();
    el.classList.toggle("hot",hot);
    el.style.opacity=String((hot?1:depth*.85)*D[i]*labIn);
    el.style.transform="translate("+s.x.toFixed(1)+"px,"+(s.y+rad+6).toFixed(1)+"px) translateX(-50%)";
  });

  if(++frameNo%6===0){
    const deg=x=>(((x*180/Math.PI)%360+360)%360).toFixed(1);
    coords.textContent="θ "+deg(camS.th)+"° · φ "+deg(camS.ph)+"° · r "+camS.r.toFixed(0);
  }
  renderer.render(scene,camera);
}

window.addEventListener("resize",resize);
resize();
startIntro();
requestAnimationFrame(frame);
})();
</script>
